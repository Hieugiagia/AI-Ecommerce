server:
  port: 5000 # Hoặc cổng 5000 / 8080 tùy bạn thiết lập
  servlet:
    context-path: /api

spring:
  application:
    name: ai-ecommerce-backend

  # 1. Kết nối PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 2. Kết nối Redis Cache
  data:
    redis:
      host: localhost
      port: 6379

  # 3. Kết nối RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# 4. Cấu hình Chuẩn JWT Security (CẦN BỔ SUNG Đoạn NÀY)
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # Thời gian sống 24 giờ (tính bằng milisec)
  refreshExpirationMs: 604800000 # Refresh token sống 7 ngày


server:
  port: 8080

spring:
  application:
    name: ai-ecommerce-backend

  # 1. K?t n?i PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 2. K?t n?i Redis Cache
  data:
    redis:
      host: localhost
      port: 6379

  # 3. K?t n?i RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jwt:
    # Chuỗi Secret Key mã hóa (tối thiểu 32 ký tự / 256 bits)
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    # Hạn dùng Access Token (15 phút = 900.000 ms)
    access-expiration: 900000
    # Hạn dùng Refresh Token (7 ngày = 604.800.000 ms)
    refresh-expiration: 604800000
